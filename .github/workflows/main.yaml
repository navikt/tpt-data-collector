name: Build and deploy main
on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test-build-deploy:
    name: test-build-deploy
    permissions:
      actions: read # for sarif
      contents: write # for dependency graph & sarif
      security-events: write # push sarif to github security
      id-token: write # for nais docker-build-push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Test & build
        run: ./gradlew test build
      - name: Build & push docker image + SBOM
        uses: nais/docker-build-push@main
        id: docker-push
        with:
          team: appsec
          pull: true
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6.3.0
      - name: Scan docker image for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ steps.docker-push.outputs.image }}'
          format: 'sarif'
          scanners: 'secret'
          output: 'trivy.sarif'
      - uses: github/codeql-action/upload-sarif@v4.38.0
        with:
          sarif_file: 'trivy.sarif'
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    permissions:
        contents: read # needs to read app descriptor
        id-token: write # for nais deploy
    needs: test-build-deploy
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: nais/deploy/actions/deploy@master
        env:
          RESOURCE: .nais/nais.yaml
          CLUSTER: prod-gcp
          IMAGE: ${{ needs.test-build-deploy.outputs.image }}

name: "CodeQL"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '32 13 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-kotlin:
    name: analyze-kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # required by codeql
      packages: read # required by codeql
      actions: read # required by codeql
      contents: read # required by codeql
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended,security-and-quality
          config: |
            threat-models: local

      - name: Gradle build
        run: ./gradlew build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.3
  analyze-github-actions:
    name: analyze-github-actions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # required by codeql
      packages: read # required by codeql
      actions: read # required by codeql
      contents: read # required by codeql
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: actions
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.3

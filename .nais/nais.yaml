apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: tpt-data-collector
  namespace: appsec
  labels:
    team: appsec
spec:
  ingresses:
    - https://tpt-data-collector.nav.no/webhook/github
  image: {{image}}
  port: 8080
  accessPolicy:
    outbound:
      external:
        - host: github.com
        - host: login.microsoftonline.com
      rules:
        - application: neo4j
        - application: whodis
        - application: tpt-backend
    inbound:
      rules:
        - application: tpt-backend
  liveness:
    path: /internal/isAlive
  readiness:
    path: /internal/isReady
  replicas:
    max: 2
    min: 2
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  observability:
    logging:
      destinations:
        - id: loki
  prometheus:
    enabled: true
    path: /internal/metrics
  env:
    - name: WHODIS_URL
      value: http://whodis.appsec
    - name: TPT_BACKEND_URL
      value: http://tpt-backend
    - name: TPT_BACKEND_TARGET
      value: api://prod-gcp.appsec.tpt-backend/.default
  envFrom:
    - secret: tpt-data-collector
    - secret: tpt-graph
  azure:
    application:
      enabled: true
